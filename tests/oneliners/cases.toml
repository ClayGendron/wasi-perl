# ---------------------------------------------------------------------------
# counting: uniq, sort, frequencies

[[case]]
id = "count-uniq-seen"
category = "counting"
argv = ["-ne", 'print unless $seen{$_}++', "dups.txt"]
fixtures = ["dups"]

[[case]]
id = "count-by-frequency"
category = "counting"
argv = ["-ne", '$c{$_}++; END { print "$c{$_} $_" for sort { $c{$b} <=> $c{$a} || $a cmp $b } keys %c }', "dups.txt"]
fixtures = ["dups"]

[[case]]
id = "count-word-frequency"
category = "counting"
argv = ["-nle", '$w{lc $1}++ while /(\w+)/g; END { printf "%-10s %d\n", $_, $w{$_} for (sort { $w{$b} <=> $w{$a} || $a cmp $b } keys %w)[0 .. 4] }', "notes.txt"]
fixtures = ["notes"]

[[case]]
id = "count-sort-numeric"
category = "counting"
argv = ["-e", 'print sort { $a <=> $b } <>']
stdin = "10\n9\n100\n-1\n3.5\n1e2\n"

[[case]]
id = "count-sort-by-column"
category = "counting"
argv = ["-e", 'print map { $_->[1] } sort { $b->[0] <=> $a->[0] } map { [(split /,/)[2], $_] } grep { !/^name/ } <>', "data.csv"]
fixtures = ["csv"]

[[case]]
id = "count-sort-unique"
category = "counting"
argv = ["-e", 'my %s; $s{$_}++ for <>; print sort keys %s', "dups.txt"]
fixtures = ["dups"]

[[case]]
id = "count-sort-by-length"
category = "counting"
argv = ["-e", 'print sort { length($a) <=> length($b) or $a cmp $b } <>', "dups.txt"]
fixtures = ["dups"]

[[case]]
id = "count-hash-size"
category = "counting"
argv = ["-ne", '$h{$_} = 1; END { print scalar(keys %h), " ", scalar(%h), "\n" }', "dups.txt"]
fixtures = ["dups"]

[[case]]
id = "count-large-sort"
category = "counting"
argv = ["-e", 'my @n = map { ($_ * 7919) % 1000 } 1 .. 500; my @s = sort { $a <=> $b } @n; print "@s[0 .. 9] | @s[-5 .. -1]\n"; my %c; $c{$_}++ for @n; print scalar(keys %c), "\n"']

