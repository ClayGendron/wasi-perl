[[case]]
id = "inplace-append-at-eof"
category = "inplace"
argv = ["-pi", "-e", '$_ .= "added\n" if eof', "a.txt", "b.txt"]
fixtures = ["abc"]

[[case]]
id = "inplace-insert-header"
category = "inplace"
argv = ["-pi", "-e", 'print "// header\n" if $. == 1; close ARGV if eof', "main.c", "util.c"]
fixtures = ["src"]

[[case]]
id = "inplace-with-l"
category = "inplace"
argv = ["-lpi", "-e", '$_ .= ";"', "a.txt"]
fixtures = ["abc"]

