id = "sw-script-file-check"
category = "switches"
argv = ["-c", "report.pl"]
files = { "report.pl" = "use strict;\nmy $x = 1;\nprint $x\n" }

[[case]]
id = "sw-script-shebang-w"
category = "switches"
argv = ["warn.pl"]
files = { "warn.pl" = "#!/usr/bin/perl -w\nmy $u;\nprint \"value: \", $u + 0, \"\\n\";\n" }

[[case]]
id = "sw-script-die-line"
category = "switches"
argv = ["fail.pl", "arg1"]
files = { "fail.pl" = "use strict;\nuse warnings;\nmy $a1 = shift;\nprint \"got $a1\\n\";\ndie \"stopping\";\n" }
