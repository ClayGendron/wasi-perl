# ---------------------------------------------------------------------------
# grep: print matching lines

[[case]]
id = "grep-match"
category = "grep"
argv = ["-ne", 'print if /ERROR/', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-icase"
category = "grep"
argv = ["-ne", 'print if /error/i', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-invert"
category = "grep"
argv = ["-ne", 'print unless /INFO/', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-count"
category = "grep"
argv = ["-ne", '$n++ if /INFO/; END { print "$n\n" }', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-line-numbers"
category = "grep"
argv = ["-ne", 'print "$.:$_" if /timeout/', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-capture"
category = "grep"
argv = ["-nle", 'print $1 if /id=(\d+)/', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-all-matches"
category = "grep"
argv = ["-nle", 'print for /\b(\d{2}:\d{2}):\d{2}\b/g', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-files-with-matches"
category = "grep"
argv = ["-ne", 'if (/foo/) { print "$ARGV\n"; close ARGV }', "a.txt", "b.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "grep-stdin"
category = "grep"
argv = ["-ne", 'print if /b/']
stdin = "abc\nxyz\nbbb\n"

[[case]]
id = "grep-flipflop-regex"
category = "grep"
argv = ["-ne", 'print if /WARN/../timeout/', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-flipflop-lines"
category = "grep"
argv = ["-ne", 'print if 2..4', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-head-exit"
category = "grep"
argv = ["-ne", 'print; exit if $. == 3', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-previous-line"
category = "grep"
argv = ["-ne", 'print $p, $_ if /ERROR/; $p = $_', "app.log"]
fixtures = ["log"]

[[case]]
id = "grep-named-captures"
category = "grep"
argv = ["-nle", 'print "$+{date} $+{level}" if /^(?<date>\S+) \S+ (?<level>[A-Z]+)/', "app.log"]
fixtures = ["log"]

# ---------------------------------------------------------------------------
# multifile: $., eof and $ARGV across several files

[[case]]
id = "multi-line-numbers-continue"
category = "multifile"
argv = ["-ne", 'print "$ARGV:$.:$_"', "a.txt", "b.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-eof-resets"
category = "multifile"
argv = ["-ne", 'print "$ARGV:$.:$_"; close ARGV if eof', "a.txt", "b.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-eof-parens-last-file"
category = "multifile"
argv = ["-ne", 'print "last: $_" if eof()', "a.txt", "b.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-count-per-file"
category = "multifile"
argv = ["-ne", '$c{$ARGV}++; END { print "$_ $c{$_}\n" for sort keys %c }', "a.txt", "b.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-first-line-each"
category = "multifile"
argv = ["-ne", 'print "$ARGV: $_" if $. == 1; close ARGV if eof', "a.txt", "b.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-stdin-dash"
category = "multifile"
argv = ["-ne", 'print "$ARGV $_"', "a.txt", "-", "b.txt"]
fixtures = ["abc"]
stdin = "from stdin\n"

[[case]]
id = "multi-end-total"
category = "multifile"
argv = ["-ne", 'END { print "$.\n" }', "a.txt", "b.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-tac"
category = "multifile"
argv = ["-e", 'print reverse <>', "a.txt", "c.txt"]
fixtures = ["abc"]

[[case]]
id = "multi-tail"
category = "multifile"
argv = ["-e", '@l = <>; print @l[-2, -1]', "app.log"]
fixtures = ["log"]

[[case]]
id = "multi-number-lines"
category = "multifile"
argv = ["-pe", 's/^/sprintf("%4d ", $.)/e', "a.txt", "b.txt"]
fixtures = ["abc"]

# ---------------------------------------------------------------------------
# fields: -a, -F, columns and sums

[[case]]
id = "fields-column"
category = "fields"
argv = ["-lane", 'print $F[3]', "app.log"]
fixtures = ["log"]

[[case]]
id = "fields-sum"
category = "fields"
argv = ["-lane", '$s += $F[1]; END { print $s }', "nums.txt"]
fixtures = ["nums"]

[[case]]
id = "fields-last"
category = "fields"
argv = ["-lane", 'print $F[-1]', "app.log"]
fixtures = ["log"]

[[case]]
id = "fields-count"
category = "fields"
argv = ["-lane", 'print scalar @F', "app.log"]
fixtures = ["log"]

[[case]]
id = "fields-csv-filter"
category = "fields"
argv = ["-F,", "-lane", 'print $F[0] if $F[1] eq "eng"', "data.csv"]
fixtures = ["csv"]

[[case]]
id = "fields-csv-group-sum"
category = "fields"
argv = ["-F,", "-lane", 'next if $. == 1; $t{$F[1]} += $F[2]; END { printf "%s %d\n", $_, $t{$_} for sort keys %t }', "data.csv"]
fixtures = ["csv"]

[[case]]
id = "fields-csv-header-map"
category = "fields"
argv = ["-F,", "-lane", 'if ($. == 1) { @h = @F; next } my %r; @r{@h} = @F; print "$r{name}=$r{start}"', "data.csv"]
fixtures = ["csv"]

[[case]]
id = "fields-csv-table"
category = "fields"
argv = ["-F,", "-lane", 'printf "%-8s|%6s|%10s\n", @F[0 .. 2]', "data.csv"]
fixtures = ["csv"]

[[case]]
id = "fields-passwd"
category = "fields"
argv = ["-F:", "-lane", 'print "$F[0] $F[6]" if $F[2] >= 1000', "passwd.txt"]
fixtures = ["passwd"]

[[case]]
id = "fields-tsv-swap"
category = "fields"
argv = ['-F\t', "-lane", 'print join ",", @F[1, 0]', "scores.tsv"]
fixtures = ["tsv"]

[[case]]
id = "fields-tsv-average"
category = "fields"
argv = ['-F\t', "-lane", 'next if $. == 1; $s += $F[2]; $n++; END { printf "%.3f\n", $s / $n }', "scores.tsv"]
fixtures = ["tsv"]

[[case]]
id = "fields-regex-separator"
category = "fields"
argv = ['-F/\s*\|\s*/', "-lane", 'print $F[1]']
stdin = "a | b | c\nd|e|f\n1 |2| 3\n"

[[case]]
id = "fields-max"
category = "fields"
argv = ["-lane", '$m = $F[1] if !defined $m || $F[1] > $m; END { print $m }', "nums.txt"]
fixtures = ["nums"]

[[case]]
id = "fields-split-limit"
category = "fields"
argv = ["-lne", 'next unless /=/; my ($k, $v) = split /=/, $_, 2; print "$k -> $v"', "config.ini"]
fixtures = ["ini"]

[[case]]
id = "fields-reverse-columns"
category = "fields"
argv = ["-lane", 'print join "\t", reverse @F', "nums.txt"]
fixtures = ["nums"]

# ---------------------------------------------------------------------------
