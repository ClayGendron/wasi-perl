# The one-liner corpus: Perl commands of the kind coding agents run, over small files.
#
# Nothing here says what a case should print. The expected result is whatever native
# perl 5.42.3 does with the same argv, files, stdin and environment, run at test time
# (or recorded from it). A case is compared on stdout bytes, stderr bytes, exit code and
# the final contents of every file and folder in its work directory.
#
# A case has:
#   id        unique, used as the pytest id
#   category  one of the categories listed in the specification
#   argv      the arguments after "perl", exactly as a shell would pass them
#   fixtures  names of file sets from [fixtures.*] laid out in the work directory
#   files     extra files for this case only (name -> content)
#   stdin     optional text on standard input (none means an empty stdin)
#   env       optional extra environment variables
#
# A file's content is a TOML string (written as UTF-8) or { base64 = "..." } for bytes.
# A name ending in "/" makes an empty folder.
#
# Rules every case keeps, so that the oracle is a fair one:
#   - no output depends on hash order: keys are sorted before they are printed;
#   - no time, pid, random number, %ENV dump, $^O or memory address in the output;
#   - file names are relative to the work directory; readdir results are sorted.

