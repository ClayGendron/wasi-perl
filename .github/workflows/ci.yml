# Every change's check, and the build and test half of a release.
#
# lint runs ruff and the fast tests from the checkout. build makes the artifact set from the pins
# on x86-64 Linux, runs the checks on the built perl.wasm (tests/build, which need the build tree
# and the wasmtime command line, so they run here alone), copies the set into the package, builds
# the one py3-none-any wheel and the sdist, and records native perl's answers to the one-liner
# corpus in oracle.json. test installs that wheel into a fresh virtual environment on each of the
# four systems, with the checkout's src/ removed so only the installed package can be imported,
# and runs the runner, escape and one-liner tests against the set inside it. The one-liners are
# compared with oracle.json, so the same bytes must give native perl's answers everywhere. perl-t
# runs Perl's own suite on x86-64 Linux.
#
# release.yml calls this workflow and publishes what build uploaded.

name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A pull request's newer push cancels its older run; a push to dev and a release run are never
# cancelled. Called from release.yml, github.workflow is the caller's name, so the group differs
# from the caller's own and the two never wait on each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.22"
  # Every uv command that resolves the project uses uv.lock as committed.
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: The fast tests
        run: uv run pytest -m "not slow" -p no:cacheprovider

  build:
    name: build the artifact set and the wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASI_PERL_DOWNLOAD_CACHE: ${{ github.workspace }}/download-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The pinned inputs, keyed by the hash list itself: a changed pin is a new key. The build
      # verifies every cached file against downloads/SHA256SUMS exactly as it verifies a download.
      - name: Restore the pinned downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: download-cache
          key: downloads-${{ hashFiles('downloads/SHA256SUMS') }}
      - name: Build from the pins
        run: scripts/build.sh
      # A step's failure is one line naming its log, and the logs are an artifact; the end of the
      # newest log is printed here too, so the cause shows in the job's own output.
      - name: The end of the failing step's log
        if: failure()
        run: |
          log=$(ls -t build/logs/*.log 2>/dev/null | head -n 1)
          if [ -n "$log" ]; then
            echo "the last 60 lines of $log:"
            tail -n 60 "$log"
          fi
      - name: The checks on the built perl.wasm
        run: uv run pytest tests/build -p no:cacheprovider -ra --junitxml="$RUNNER_TEMP/build-junit.xml"
      # The checks of the CPAN modules need the build tree, the native install in build/native-cpan
      # and the pinned tarballs; the checks of the library index need the build tree, its stubs,
      # its logs and the wasmtime command line; the checks of wasm-opt need binaryen under
      # build/tools and the linked module in build/link. This job has all of them, so a skip here
      # means one went missing, and it fails. Every test function of the five files must have run
      # at least once.
      - name: No check of the CPAN modules, the library index or wasm-opt was skipped
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/build-junit.xml" ]; then
            echo "the checks did not run, so there is nothing to check here"
            exit 0
          fi
          uv run --no-project python -I - "$RUNNER_TEMP/build-junit.xml" <<'PY'
          import ast, sys, xml.etree.ElementTree as ET
          files = ("test_cpan_modules", "test_cpan_unpack", "test_lib_index", "test_library_lookups",
                   "test_wasm_opt")
          floor = 0
          for f in files:
              tree = ast.parse(open(f"tests/build/{f}.py", encoding="utf-8").read())
              floor += sum(isinstance(n, ast.FunctionDef) and n.name.startswith("test_") for n in tree.body)
          ran = skipped = 0
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              where, name = case.get("classname", ""), case.get("name", "")
              if not where:  # a whole module, collected or skipped as one
                  where, name = name, "(the module)"
              if not where.startswith(tuple(f"tests.build.{f}" for f in files)):
                  continue
              ran += 1
              skip = case.find("skipped")
              if skip is None:
                  skip = case.find("error")
              if skip is not None:
                  skipped += 1
                  print(f"did not run: {where}::{name}: {skip.get('message')}")
          print(f"{ran} checks of the CPAN modules, the library index and wasm-opt (at least {floor}), {skipped} skipped")
          sys.exit(1 if skipped or ran < floor else 0)
          PY
      - name: Keep the verified downloads for the next run
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          mkdir -p download-cache
          while read -r _ name _; do
            [ -n "$name" ] && cp "downloads/$name" download-cache/
          done < downloads/SHA256SUMS
      - name: Save the pinned downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: download-cache
          key: downloads-${{ hashFiles('downloads/SHA256SUMS') }}
      - name: The build's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore
      - name: Copy the verified set into the package
        run: uv run --no-project python -I scripts/assemble_artifacts.py
      - name: Build the wheel and the sdist
        run: |
          set -eu
          rm -rf dist
          uv build --out-dir dist
          ls dist
          wheels=(dist/wasi_perl-*-py3-none-any.whl)
          sdists=(dist/wasi_perl-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ] || [ ! -f "${sdists[0]}" ]; then
            echo "dist/ does not hold exactly one py3-none-any wheel and one sdist"
            exit 1
          fi
          # The wheel must carry the set exactly as assembled.
          uv run --no-project python -I - "${wheels[0]}" <<'PY'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          for need in ("perl.wasm", "MANIFEST", "SHA256SUMS", "dev/null", "Artistic", "Copying"):
              if f"wasi_perl/artifacts/{need}" not in names:
                  sys.exit(f"the wheel has no wasi_perl/artifacts/{need}")
          if not any(n.startswith("wasi_perl/artifacts/lib/perl5/5.42/") for n in names):
              sys.exit("the wheel has no library under wasi_perl/artifacts/lib/perl5/5.42/")
          meta = next(n for n in names if n.endswith(".dist-info/METADATA"))
          files = [ln for ln in zipfile.ZipFile(sys.argv[1]).read(meta).decode().splitlines()
                   if ln.startswith("License-File: ")]
          for need in ("LICENSE", "src/wasi_perl/artifacts/Artistic", "src/wasi_perl/artifacts/Copying"):
              if f"License-File: {need}" not in files:
                  sys.exit(f"the wheel's metadata names no licence file {need}")
          PY
          {
            echo "### The wheel"
            echo
            echo '```'
            for f in dist/*; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(stat -c %s "$f") bytes  ${f#dist/}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Native perl 5.42.3, built from the same tarball, answers every case of the one-liner
      # corpus once here; the test legs compare the installed wheel's answers with this file.
      # The module cases run with build/native-cpan on PERL5LIB, and the file records the CPAN
      # versions they ran with; without the pinned versions there, the recorder refuses and
      # this step fails.
      - name: Record the oracle's answers
        run: |
          mkdir -p oracle
          uv run python tests/oneliners/record_oracle.py \
            --perl build/native-install/bin/perl --out oracle/oracle.json
      # Perl's own suite needs the set and the target tree's generated lib/ (Config.pm and kin).
      - name: Pack the set and the target library
        run: |
          tar -cf artifact-set.tar -C build artifacts
          tar -cf target-lib.tar -C build target/lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle
          path: oracle/oracle.json
          if-no-files-found: error
      # The release assets beside the wheel: the module, its manifest and their hashes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/artifacts/perl.wasm
            build/artifacts/MANIFEST
            build/artifacts/SHA256SUMS
          if-no-files-found: error
      # As tars, so empty files and the folder layout survive, for perl-t.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-set
          path: |
            artifact-set.tar
            target-lib.tar
          if-no-files-found: error
          retention-days: 7

  test:
    name: test the installed wheel (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read  # DIAGNOSTIC ONLY: the pre-019 wheel from another run
    steps:
      # The corpus and the tests compare bytes, so Windows must check out the same bytes as Linux.
      - name: Check out bytes as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: wheelhouse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oracle
          path: oracle
      # With src/ gone, nothing in the checkout can stand in for the installed package.
      - name: Remove the checkout's package
        run: rm -rf src
      - name: Install the wheel into a fresh environment
        run: |
          set -eu
          venv="$RUNNER_TEMP/wheel-venv"
          # The oldest Python the package declares, so the floor in requires-python is tested.
          uv venv --python 3.11 "$venv"
          if [ "$RUNNER_OS" = Windows ]; then py="$venv/Scripts/python.exe"; else py="$venv/bin/python"; fi
          wheel=$(ls wheelhouse/wasi_perl-*-py3-none-any.whl)
          # The wheel by its plain name, as `pip install wasi-perl` would install it.
          uv pip install --python "$py" "$wheel"
          # The tests' own tools, at the versions uv.lock holds, without the project itself.
          uv export --only-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/dev.txt"
          uv pip install --python "$py" -r "$RUNNER_TEMP/dev.txt"
          echo "WHEEL_PY=$py" >> "$GITHUB_ENV"
      # DIAGNOSTIC ONLY (a draft pull request that is closed, not merged): on ARM, the smoke run
      # many times, each a fresh process, in variants, counting aborts at exit.
      - name: Diagnostic, the pre-019 wheel (dev at 8897c22)
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: wheelhouse-pre019
          run-id: 45472856248
          github-token: ${{ github.token }}
      - name: The installed package is the one imported, and it runs perl
        if: matrix.os != 'ubuntu-24.04-arm'
        run: |
          "$WHEEL_PY" -I - <<'PY'
          import pathlib, wasi_perl
          where = pathlib.Path(wasi_perl.__file__).resolve()
          print(where)
          assert "site-packages" in where.parts, where
          done = wasi_perl.run(["-e", 'print "hello\\n"'])
          print(done)
          assert (done.exit_code, done.stdout) == (0, b"hello\n"), done
          PY
      - name: Diagnostic, aborts at exit per variant (ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        timeout-minutes: 45
        run: |
          set -eu
          uname -a; nproc
          wheel=$(ls wheelhouse/wasi_perl-*-py3-none-any.whl)
          old=$(ls wheelhouse-pre019/wasi_perl-*-py3-none-any.whl)
          uv venv -q --python 3.13 "$RUNNER_TEMP/py313"
          uv pip install -q --python "$RUNNER_TEMP/py313/bin/python" "$wheel"
          uv venv -q --python 3.11 "$RUNNER_TEMP/pre019"
          uv pip install -q --python "$RUNNER_TEMP/pre019/bin/python" "$old"
          "$WHEEL_PY" -VV; "$RUNNER_TEMP/py313/bin/python" -VV
          export PY311="$WHEEL_PY" PY313="$RUNNER_TEMP/py313/bin/python" PRE019="$RUNNER_TEMP/pre019/bin/python"
          "$WHEEL_PY" -I - <<'PY'
          import collections, os, subprocess, tempfile, time

          SMOKE = '''
          import pathlib, wasi_perl
          where = pathlib.Path(wasi_perl.__file__).resolve()
          print(where)
          assert "site-packages" in where.parts, where
          done = wasi_perl.run(["-e", 'print "hello\\\\n"'])
          print(done)
          assert (done.exit_code, done.stdout) == (0, b"hello\\n"), done
          '''
          TAIL = {
              "plain": "",
              # the runner's own atexit hook taken away
              "no-atexit": "import atexit\nfrom wasi_perl import _engines\natexit.unregister(_engines._release_at_exit)\n",
              # wait, GIL released, until wasmtime-py's stream finalizers have all run
              "drain": (
                  "import time\nfrom wasmtime import _wasi\nend = time.monotonic() + 2\n"
                  "while _wasi.CUSTOM_OUTPUTS.handles and time.monotonic() < end:\n    time.sleep(0.001)\n"
              ),
              # no interpreter finalization at all
              "os-exit": "import os, sys\nsys.stdout.flush()\nos._exit(0)\n",
              # the explicit release first, then a normal exit
              "release-first": "from wasi_perl import _engines\n_engines._release_at_exit()\n",
          }
          PENDING = '''
          import atexit, os
          box = {}
          def last():  # registered first: runs after every other atexit hook
              os.write(2, f"PENDING returned={box['r']} atexit_end={len(box['s'].handles)}\\n".encode())
          atexit.register(last)
          ''' 
          PENDING_AFTER = "from wasmtime import _wasi\nbox['s'] = _wasi.CUSTOM_OUTPUTS\nbox['r'] = len(_wasi.CUSTOM_OUTPUTS.handles)\n"
          FORCED = r'''
          import builtins, sys, time, wasmtime
          from wasmtime import _wasi
          WAT = """(module
            (import "wasi_snapshot_preview1" "fd_write" (func $w (param i32 i32 i32 i32) (result i32)))
            (memory (export "memory") 1) (data (i32.const 16) "hi\\n")
            (func (export "_start")
              (i32.store (i32.const 0) (i32.const 16)) (i32.store (i32.const 4) (i32.const 3))
              (drop (call $w (i32.const 1) (i32.const 0) (i32.const 1) (i32.const 8)))))"""
          class ReleaseLate:
              import os, time
              def __init__(self, slab): self.slab = slab
              def __del__(self):
                  self.os.write(2, f"late release, pending={len(self.slab.handles)}\n".encode())
                  self.time.sleep(0.05)
          eng = wasmtime.Engine(); mod = wasmtime.Module(eng, WAT)
          linker = wasmtime.Linker(eng); linker.define_wasi()
          store = wasmtime.Store(eng)
          cfg = wasmtime.WasiConfig(); cfg.stdout_custom = lambda b: len(b); cfg.stderr_custom = lambda b: len(b)
          store.set_wasi(cfg)
          linker.instantiate(store, mod).exports(store)["_start"](store)
          sys.setswitchinterval(1000.0)
          store.close()
          end = time.perf_counter() + 0.05
          while time.perf_counter() < end:
              pass
          builtins._release_late = ReleaseLate(_wasi.CUSTOM_OUTPUTS)
          '''

          import textwrap
          def dedent(s):
              return textwrap.dedent(s).lstrip("\n")

          PY311, PY313, PRE019 = os.environ["PY311"], os.environ["PY313"], os.environ["PRE019"]
          VARIANTS = [
              # name, python, script, iterations, fresh cache per run
              ("dev-plain-cold", PY311, dedent(SMOKE), 100, True),
              ("pre019-plain-cold", PRE019, dedent(SMOKE), 100, True),
              ("dev-plain-warm", PY311, dedent(SMOKE), 300, False),
              ("pre019-plain-warm", PRE019, dedent(SMOKE), 300, False),
              ("dev-no-atexit-warm", PY311, dedent(SMOKE) + TAIL["no-atexit"], 200, False),
              ("dev-release-first-warm", PY311, dedent(SMOKE) + TAIL["release-first"], 200, False),
              ("dev-drain-warm", PY311, dedent(SMOKE) + TAIL["drain"], 200, False),
              ("dev-os-exit-warm", PY311, dedent(SMOKE) + TAIL["os-exit"], 200, False),
              ("dev-py313-warm", PY313, dedent(SMOKE), 200, False),
              ("dev-pending-warm", PY311, dedent(PENDING) + dedent(SMOKE) + PENDING_AFTER, 200, False),
              ("forced-py311", PY311, dedent(FORCED), 40, False),
              ("forced-py313", PY313, dedent(FORCED), 40, False),
          ]
          env = dict(os.environ, RUST_BACKTRACE="full")
          summary = []
          for name, py, script, n, cold in VARIANTS:
              path = os.path.join(os.environ["RUNNER_TEMP"], f"diag-{name}.py")
              with open(path, "w") as f:
                  f.write(script)
              warm = tempfile.mkdtemp(prefix=f"cache-{name}-")
              codes, first, pend = collections.Counter(), None, collections.Counter()
              start = time.monotonic()
              for i in range(n):
                  cache = tempfile.mkdtemp(prefix="cache-") if cold else warm
                  p = subprocess.run([py, "-I", path], env=dict(env, WASI_PERL_CACHE=cache),
                                     stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  codes[p.returncode] += 1
                  err = p.stderr.decode(errors="replace")
                  for line in err.splitlines():
                      if line.startswith("PENDING "):
                          pend[line] += 1
                  if p.returncode != 0 and first is None:
                      first = (i, p.returncode, p.stdout.decode(errors="replace"), err)
              took = time.monotonic() - start
              line = f"{name}: n={n} exit codes={dict(codes)} aborts(SIGABRT)={codes[-6] + codes[134]} ({took:.0f} s)"
              print(line, flush=True)
              for k, v in sorted(pend.items()):
                  print(f"    {v:4d}  {k}")
              if first is not None:
                  print(f"  first failure, iteration {first[0]}, exit {first[1]}\n  --- stdout ---\n{first[2]}\n  --- stderr ---\n{first[3]}", flush=True)
              summary.append(line)
          print("\n==== SUMMARY ====\n" + "\n".join(summary))
          PY
      # The shared fixtures find a set through WASI_PERL_ARTIFACTS: here it names the one inside
      # the installed wheel, so every guest run uses the wheel's own bytes.
      - name: The tests, against the installed wheel
        env:
          # No native perl is the oracle here: the one-liners compare with the recorded answers.
          WASI_PERL_ORACLE_JSON: ${{ github.workspace }}/oracle/oracle.json
        run: |
          set -eu
          WASI_PERL_ARTIFACTS=$("$WHEEL_PY" -I -c "import pathlib, wasi_perl; print(pathlib.Path(wasi_perl.__file__).parent / 'artifacts')")
          export WASI_PERL_ARTIFACTS
          "$WHEEL_PY" -m pytest tests/runner tests/escapes tests/oneliners tests/mounts \
            -p no:cacheprovider -ra --junitxml="$RUNNER_TEMP/junit.xml"
      # A guest check that skipped proved nothing: the escape tests (the mounts' among them), the
      # guest one-liners (the module cases among them, compared with answers recorded with the
      # CPAN modules), the checks of docs/fast-perl.md's numbers, the checks of the kept runtime
      # scan and of a library name in another case, and every check of the mounts must all have
      # run (a known difference, an expected
      # failure, is reported and allowed). A skip of a whole module shows in JUnit with an empty
      # classname and the module as its name, so it is counted too. And at least one escape test per test function and one one-liner per
      # corpus case must have run, so a collection that drops checks fails. The one exception is
      # a check of a host feature the system does not have, by its exact reason: Windows has no
      # POSIX links an unprivileged process can make, and no FIFOs; and it keeps no scan of the
      # runtime, so the checks of a kept scan do not apply there.
      - name: No guest check was skipped
        if: always()
        run: |
          if [ -z "${WHEEL_PY:-}" ] || [ ! -f "$RUNNER_TEMP/junit.xml" ]; then
            echo "the tests did not run, so there is nothing to check here"
            exit 0
          fi
          "$WHEEL_PY" -I - "$RUNNER_TEMP/junit.xml" <<'PY'
          import ast, sys, tomllib, xml.etree.ElementTree as ET
          cases = len(tomllib.load(open("tests/oneliners/cases.toml", "rb"))["case"])
          import glob
          def tests_in(*paths, prefix="test_"):
              count = 0
              for path in paths:
                  tree = ast.parse(open(path, encoding="utf-8").read())
                  count += sum(isinstance(n, ast.FunctionDef) and n.name.startswith(prefix) for n in tree.body)
              return count
          escapes = tests_in("tests/escapes/test_escapes.py", "tests/escapes/test_mount_escapes.py")
          kept = tests_in("tests/runner/test_kept_checks.py")
          page = tests_in("tests/oneliners/test_fast_perl.py", prefix="test_guest_")
          lettercase = tests_in("tests/runner/test_library_case.py")
          mounts = tests_in(*sorted(glob.glob("tests/mounts/test_*.py")))
          floor = cases + escapes + kept + page + lettercase + mounts
          host_lacks = set()
          if sys.platform == "win32":
              host_lacks = {"POSIX links", "POSIX FIFOs", "a scan is not kept on this system"}
          ran = skipped = 0
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              where, name = case.get("classname", ""), case.get("name", "")
              if not where:  # a whole module, collected or skipped as one
                  where, name = name, "(the module)"
              guest = where.startswith(
                  (
                      "tests.escapes",
                      "tests.runner.test_kept_checks",
                      "tests.runner.test_library_case",
                      "tests.mounts",
                  )
              ) or (
                  where.startswith(("tests.oneliners.test_oneliners", "tests.oneliners.test_fast_perl"))
                  and (name.startswith("test_guest_") or name == "(the module)")
              )
              if not guest:
                  continue
              ran += 1
              skip = case.find("skipped")
              if skip is None:
                  skip = case.find("error")
              if skip is not None and skip.get("type") != "pytest.xfail":
                  if skip.get("message") in host_lacks:
                      print(f"allowed: {where}::{name}: this host lacks {skip.get('message')}")
                      continue
                  skipped += 1
                  print(f"did not run: {where}::{name}: {skip.get('message')}")
          print(f"{ran} guest checks (at least {floor}: {cases} cases, {escapes} escape tests, {page} page checks, {kept} kept-scan checks, {lettercase} library-case checks, {mounts} mount checks), {skipped} skipped")
          sys.exit(1 if skipped or ran < floor else 0)
          PY

  perl-t:
    name: Perl's own suite
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASI_PERL_DOWNLOAD_CACHE: ${{ github.workspace }}/download-cache
      WASI_PERL_ARTIFACTS: ${{ github.workspace }}/build/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: download-cache
          key: downloads-${{ hashFiles('downloads/SHA256SUMS') }}
      # The harness copies t/ from the pinned tarball, verified here like every download.
      - name: The verified tarball
        run: scripts/00_download.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-set
      - name: The build job's set and target library
        run: |
          tar -xf artifact-set.tar -C build
          tar -xf target-lib.tar -C build
      - name: Run the suite
        run: uv run python tests/perl_t/run_suite.py --quiet --list-failures
      - name: The scoreboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perl-t-results
          path: |
            build/perl_t/results.json
            build/perl_t/logs/
          if-no-files-found: ignore
